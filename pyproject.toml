[project]
name = "stock-analyzer"
version = "0.1.0"
description = "Daily stock tracker with technical indicators and LLM trend forecasts via Claude / Codex subscription CLIs"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2.50",
    "pandas>=2.2",
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "apscheduler>=3.10,<4",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stock_analyzer = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
