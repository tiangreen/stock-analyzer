# Tickers use Yahoo Finance symbols. European listings take an exchange suffix:
#   .DE Xetra, .PA Paris, .AS Amsterdam, .L London, .MI Milan, .SW Zurich, .ST Stockholm
# Asian listings use the exchange's numeric code plus a suffix:
#   .KS Korea KOSPI (005930.KS Samsung), .KQ Korea KOSDAQ, .T Tokyo (7203.T Toyota)
# The dashboard's add box also searches by company name.
# This list only seeds an empty database; after that, manage the watchlist in the dashboard.
watchlist:
  - AAPL
  - MSFT
  - NVDA
  - SAP.DE
  - ASML.AS
  - 005930.KS
  - 7203.T

# Default model provider: "claude" (Claude Code CLI), "codex" (Codex CLI, ChatGPT login) or
# the name of an API provider below (anthropic-api, openai-api, or one you add).
provider: claude

# API providers: models called over HTTPS with a key or token, billed per token, instead of
# through a subscription CLI. See "API providers" in the README.
# Secrets never go in this file. Each entry NAMES the environment variables that hold them;
# set those where the app is started. Two entries are built in and need no lines here:
#   anthropic-api  (type anthropic, key from ANTHROPIC_API_KEY)
#   openai-api     (type openai,    key from OPENAI_API_KEY)
# Add your own under api_providers. `type: openai` is any service that speaks the OpenAI
# chat-completions format.
#
# api_providers:
#   openrouter:                       # an OpenAI-compatible service with an API key
#     type: openai
#     label: OpenRouter               # name shown in the dashboard
#     base_url: https://openrouter.ai/api/v1
#     api_key_env: OPENROUTER_API_KEY
#     model: ""                       # default model; can also be picked in Settings
#   gateway:                          # a gateway behind M2M authorization (OAuth2 client credentials)
#     type: openai
#     label: Company gateway
#     base_url: https://llm.example.com/v1
#     oauth:
#       token_url: https://login.example.com/oauth2/token
#       client_id_env: LLM_CLIENT_ID
#       client_secret_env: LLM_CLIENT_SECRET
#       scope: ""                     # optional
#       audience: ""                  # optional
#       auth_style: basic             # how the client ID and secret are sent: basic (header) or body
#     headers: {}                     # optional extra request headers (no secrets)
#     models: []                      # optional: the models Settings offers
#     response_format: none           # none, json_object or json_schema (what the service supports)
#   openai-api:
#     enabled: false                  # hides a built-in provider

# Model per provider. Empty string = whatever the CLI defaults to (API providers: their default).
models:
  claude: ""
  codex: "gpt-6-sol"   # list what your account offers with: codex debug models

# Currency the dashboard shows prices in: EUR or USD (switchable in the header).
# Analysis and forecasts are always done in each stock's own trading currency.
display_currency: EUR

# Dashboard language: en, de or zh (switchable in the header). New analyses are written in
# this language too; analyses already stored keep the language they were written in.
language: en

# Reasoning effort per provider. Empty string = the model's default.
# Claude: low, medium, high, xhigh, max. Codex: depends on the model (see Settings).
# Model and effort chosen in the dashboard's Settings tab override these.
efforts:
  claude: ""
  codex: ""

# Forecast horizons in trading days.
horizons: [1, 5, 20]

# Trade signals (buy / sell / hold) for placing orders by hand at your broker. The model
# proposes a signal; it is shown as "hold" unless it passes every limit below.
signals:
  min_confidence: 0.6       # model confidence a buy or sell needs (0-1)
  max_entry_gap_pct: 3.0    # limit price may be at most this far from the last close
  min_reward_risk: 1.5      # buy: (take-profit - limit) / (limit - stop-loss) must reach this
  max_stop_pct: 10.0        # buy: stop-loss may be at most this far below the limit
  risk_per_trade_pct: 1.0   # buy: size the position so that hitting the stop loses this share of the portfolio
  max_position_pct: 10.0    # buy: never suggest more than this share of the portfolio in one stock
  portfolio_value: 0        # optional: your portfolio size, to show position sizes as an amount (0 = show % only)
  portfolio_currency: EUR

# Discover tab: the model recommends stocks you do not track yet, short-term and long-term.
# Code screens the markets below and scores every candidate; the model chooses among the
# best-scored shortlist. Each run costs two model calls. See "Discover" in the README.
discovery:
  # Markets on offer (home exchanges only). Which of them a search covers, one or any
  # combination, is ticked in the Discover tab.
  regions: [us, de, fr, nl, ch, gb, jp, kr]
  min_market_cap_usd: 2000000000
  min_dollar_volume_usd: 5000000    # average traded per day
  min_turnover: 0.00025             # daily traded value / market cap; drops foreign cross-listings
  universe_size: {us: 300, default: 100}   # largest stocks taken per region
  finalists: 40                     # per category: stocks that get the full data fetch
  shortlist: 12                     # per category: what the model chooses from
  max_shortlist_per_sector: 4
  picks: 5                          # per category: most the model may recommend
  max_picks_per_sector: 2
  min_conviction: 0.5               # picks below this model conviction (0-1) are dropped
  horizons: {short: 20, long: 120}  # trading days after which a pick is graded against its index
  llm_timeout: 600                  # seconds; the shortlist prompt is long
  weights:                          # pillar weights of the score (any scale)
    short: {momentum: 30, revisions: 25, drift: 15, volume: 10, catalyst: 10, overextension: 10}
    long: {quality: 30, valuation: 25, growth: 20, estimates: 10, trend: 10, risk: 5}

# How much daily history to keep per ticker (yfinance period string).
history_period: 2y

# Seconds to wait for one model call.
llm_timeout: 300

# Daily run, fired by the dashboard server while it is running (local time).
schedule:
  enabled: true
  time: "22:30"
  weekdays_only: true

server:
  host: 127.0.0.1
  port: 8765
